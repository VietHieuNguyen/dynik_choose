<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF9F5" />
    <meta name="description" content="DYNIK — Vài câu hỏi ngắn giúp gợi ý mùi hương và sản phẩm phù hợp nhất với bạn." />
    <title>DYNIK — Gợi ý sản phẩm phù hợp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="visually-hidden" href="#main">Bỏ qua đến nội dung chính</a>

    <div class="page-container">
      <header class="app-header">
        <a href="#" class="app-header__brand" id="header-logo-link" aria-label="DYNIK">
          <img src="assets/logo-dynik.png" alt="DYNIK" class="app-header__logo" />
        </a>
      </header>

      <main class="shell" id="main">
      <!-- Category selection -->
      <section class="screen is-active" id="screen-categories" aria-labelledby="intro-title">
        <h1 class="h1" id="intro-title">Chọn loại sản phẩm</h1>
        <p class="lede" id="intro-lede">Vài câu hỏi ngắn giúp gợi ý mùi hương phù hợp nhất với bạn.</p>
        <div class="category-grid" id="category-grid" role="list"></div>
      </section>

      <!-- Quiz -->
      <section class="screen" id="screen-quiz" aria-live="polite"></section>

      <!-- Result -->
      <section class="screen" id="screen-result" aria-live="polite"></section>

      <!-- Error -->
      <section class="screen" id="screen-error" role="alert">
        <div class="status-banner">
          <h2>Không thể tải bộ câu hỏi</h2>
          <p class="status-banner__message">Đã có lỗi khi tải dữ liệu. Vui lòng thử lại.</p>
          <button type="button" class="btn btn--primary" id="retry-button">Tải lại</button>
        </div>
      </section>

      <!-- Sticky buy (mobile only) -->
      <div class="sticky-buy" id="sticky-buy" aria-hidden="true"></div>

      <footer class="footer">
        Gợi ý dựa trên câu trả lời của bạn. Phần trăm hiển thị là chỉ số khớp gu hương.<br />
        Mua sắm trên TikTok Shop
      </footer>
    </main>
  </div>

  <script src="js/assets.js" defer></script>
    <script src="js/scoring.js" defer></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
